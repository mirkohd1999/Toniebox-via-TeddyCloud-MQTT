name: TeddyCloud Android APK

on:
  push:
    branches:
      - feature/android-mqtt-app
    paths:
      - 'android-app-source.zip.b64'
      - '.github/workflows/teddycloud-android.yml'
  pull_request:
    paths:
      - 'android-app-source.zip.b64'
      - '.github/workflows/teddycloud-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already provides ANDROID_HOME and cmdline-tools.
      # setup-android@v3 currently tries to install the removed SDK package 'tools'.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack standalone Android project
        run: |
          base64 --decode android-app-source.zip.b64 > android-app-source.zip
          unzip -q android-app-source.zip
          test -f TeddyCloud-Android/android-app/app/build.gradle
      - name: Test and compile Android debug APK
        working-directory: TeddyCloud-Android/android-app
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeddyCloud-Android-debug-APK
          path: TeddyCloud-Android/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
